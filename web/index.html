<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Spectrum">
<title>Spectrum</title>
<style>
  :root { color-scheme: dark; --bg: #0e0e0f; --line: #262628; --mut: #8c8c92; --acc: #35c37a; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font: 14px/1.4 system-ui, -apple-system, "Noto Sans TC", sans-serif; color: #e4e4e6; -webkit-tap-highlight-color: transparent; }
  .stage { position: fixed; left: var(--meter-l, 0px); right: var(--meter-r, 0px); top: 0; bottom: var(--meter-b, 0px); }
  #meter { position: fixed; display: none; z-index: 1; }
  #stage2 { pointer-events: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; z-index: 9; }
  #start button { font: inherit; font-size: 18px; padding: 14px 34px; border-radius: 999px; border: 1px solid #555; background: #111; color: #fff; }
  #msg { opacity: .65; text-align: center; padding: 0 24px; }
  #dot { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(10px + var(--meter-r, 0px)); width: 8px; height: 8px; border-radius: 50%; background: #c33; z-index: 3; opacity: .8; pointer-events: none; }
  #dot.ok { background: #3c6; }
  #gear { position: fixed; top: calc(4px + env(safe-area-inset-top)); left: 6px; z-index: 3; width: 40px; height: 40px; border: 0; background: none; color: #fff; font-size: 22px; opacity: 0; pointer-events: none; transition: opacity .5s; }
  #gear.on { opacity: .5; pointer-events: auto; }

  /* 面板:直放=底部抽屜,橫放=右側欄(頻譜維持可見,邊調邊看) */
  #panel { position: fixed; z-index: 4; display: none; flex-direction: column; background: rgba(14,14,15,.93); backdrop-filter: blur(8px); border: 1px solid var(--line); }
  #panel.show { display: flex; }
  @media (orientation: portrait) { #panel { left: 0; right: 0; bottom: 0; height: 58vh; border-radius: 16px 16px 0 0; border-bottom: 0; } }
  @media (orientation: landscape) { #panel { top: 0; right: 0; bottom: 0; width: min(390px, 46vw); border-right: 0; border-top: 0; border-bottom: 0; padding-right: env(safe-area-inset-right); } }
  /* 電平表放在右側時,設定面板改靠左,避免蓋住它 */
  @media (orientation: landscape) { html[data-mpos="right"] #panel { left: 0; right: auto; border-left: 0; border-right: 1px solid var(--line); padding-right: 0; } }
  #phead { display: flex; gap: 8px; align-items: center; padding: 10px 12px 6px; }
  #phead b { flex: 1; font-size: 15px; }
  #tabs { display: flex; gap: 6px; padding: 6px 12px 10px; min-height: 34px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; line-height: 1.5; padding: 5px 14px; border-radius: 999px; border: 1px solid #333; background: transparent; color: #bbb; }
  .tab.on { background: #e9e9ec; color: #111; border-color: #e9e9ec; font-weight: 600; }
  #pbody { overflow-y: auto; padding: 4px 14px calc(20px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  button, select, input[type=text] { font: inherit; background: #1c1c1e; color: #eee; border: 1px solid #3a3a3d; border-radius: 8px; padding: 7px 11px; }
  button:active { background: #2a2a2d; }
  .primary { background: var(--acc); color: #04210f; border-color: var(--acc); font-weight: 600; }
  .danger { color: #ff8a80; }
  h4 { margin: 16px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--mut); text-transform: uppercase; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1b1b1d; min-height: 28px; }
  .row[hidden] { display: none; }
  .row .nm { flex: 1; }
  .row .hint { display: block; color: var(--mut); font-size: 12px; margin-top: 1px; }
  .row.range { flex-wrap: wrap; }
  .row.range .v { color: var(--mut); font-variant-numeric: tabular-nums; }
  .row.range input { flex: 0 0 100%; margin: 4px 0 0; accent-color: var(--acc); }
  .row select { max-width: 55%; }
  .sw { appearance: none; -webkit-appearance: none; flex: none; width: 46px; height: 28px; border-radius: 14px; background: #3a3a3d; position: relative; transition: background .15s; margin: 0; }
  .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s; }
  .sw:checked { background: var(--acc); } .sw:checked::after { left: 21px; }
  #tap { position: fixed; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); color: #fff; font-size: 18px; }
  #tap.on { display: flex; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0; }
  .chip { padding: 8px 14px; border-radius: 10px; }
  .chips.big { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
  .chips.big .chip { min-height: 46px; font-size: 15px; padding: 10px 8px; }
  .cats { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 6px; }
  .cat { flex: none; min-height: 40px; padding: 8px 16px; border-radius: 999px; border: 1px solid #333; background: transparent; color: #bbb; font-size: 15px; }
  .cat.on { background: var(--acc); border-color: var(--acc); color: #000; font-weight: 600; }
  .chip.on { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
  .save { display: flex; gap: 8px; padding: 6px 0; } .save input { flex: 1; min-width: 0; }
  .urow { display: flex; align-items: center; gap: 6px; padding: 7px 0; border-bottom: 1px solid #1b1b1d; }
  .urow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 6px 0; }
  .urow .nm.on { color: var(--acc); font-weight: 600; }
  .urow button { padding: 5px 9px; font-size: 13px; }
  .note { color: var(--mut); font-size: 12px; padding: 6px 0; }
  .info { background: #161618; border-radius: 8px; padding: 8px 10px; margin: 8px 0 2px; font-size: 12px; color: #aaa; }
  #toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: #e9e9ec; color: #111; padding: 8px 16px; border-radius: 999px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="stage" class="stage"></div>
<div id="stage2" class="stage"></div>
<canvas id="meter"></canvas>
<div id="dot"></div>
<button id="gear" aria-label="設定">⚙</button>
<div id="tap">點一下畫面繼續</div>
<div id="toast"></div>
<div id="start">
  <button id="go">開始</button>
  <div id="msg">點一下開始(手機需要一次觸碰才能啟動音訊引擎)<br>開始後點畫面任一處或左上角 ⚙ 開啟設定</div>
</div>
<div id="panel">
  <div id="phead"><b>顯示設定</b><button id="viewbtn">頻譜 ⇄ VU</button><button id="fs">全螢幕</button><button id="close" class="primary">完成</button></div>
  <div id="tabs"></div>
  <div id="pbody"></div>
</div>

<script type="module">
import AudioMotionAnalyzer from './vendor/audioMotion-analyzer.js';

const $ = id => document.getElementById(id);
const LATENCY = 0.09;     // 目標播放延遲(秒),抖動大的 Wi-Fi 可調高
const MAX_AHEAD = 0.35;   // 排程超過此值就丟包追趕
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

let ac, am, am2, gain, split, gL, gR, ws, fmt, nextT = 0, wakeLock = null;

// ======================================================================
// 設定資料
// ======================================================================
const GRADS = ['classic', 'prism', 'rainbow', 'orangered', 'steelblue', 'amber', 'vfd', 'ice', 'sunset', 'mono', 'cyan', 'magenta', 'lime'];
const CUSTOM_GRADS = {
  amber:   { bgColor: '#100800', colorStops: ['#ff3b00', '#ff9d00', '#ffd27a'] },
  vfd:     { bgColor: '#00100f', colorStops: ['#e8ffff', '#3ff', '#0aa'] },
  ice:     { bgColor: '#02060d', colorStops: ['#fff', '#8cf', '#36f'] },
  sunset:  { bgColor: '#0a0410', colorStops: ['#ffe14d', '#ff7a3d', '#c2185b', '#5b2a86'] },
  mono:    { bgColor: '#000',    colorStops: ['#fff', '#888'] },
  // 純色系,疊圖混色時左右最容易分辨
  cyan:    { bgColor: '#000',    colorStops: ['#bffcff', '#00e5ff', '#007b99'] },
  magenta: { bgColor: '#000',    colorStops: ['#ffc2f0', '#ff2bd6', '#8a0a72'] },
  lime:    { bgColor: '#000',    colorStops: ['#f4ffb0', '#b6ff00', '#4a8a00'] },
};
const G = GRADS.map(g => [g, g]);
const B = (k, l, o = {}) => ({ k, l, t: 'check', ...o });
const R = (k, l, min, max, step, o = {}) => ({ k, l, t: 'range', min, max, step, ...o });
const S = (k, l, opts, num, o = {}) => ({ k, l, t: 'select', opts, num, ...o });
const H = (l, w) => ({ h: l, w });

const isFull = c => c.viewMode === 'vu';                         // 全螢幕類比 VU
const vuShown = c => isFull(c) || (c.meterOn && c.meterStyle === 'vu');
const barShown = c => !isFull(c) && c.meterOn && c.meterStyle === 'bar';
const isGraph = c => +c.mode === 10;
const isBlend = c => c.channelLayout === 'blend';

const TABS = [
  ['presets', '預設'], ['layout', '聲道版面'], ['look', '外觀'], ['meter', '電平表'], ['peaks', '峰值/刻度'], ['analysis', '分析'], ['perf', '省電'],
];

const SCHEMA = {
  layout: [
    { info: true },
    S('channelLayout', '聲道版面', [
      ['single', '合併(單一)'], ['blend', '左右疊圖(混色)'], ['dual-combined', '左右疊圖(原生)'],
      ['dual-horizontal', '左右並排'], ['dual-vertical', '上下分割'],
    ], false, { hint: '「疊圖(混色)」左右各自上色並用混色疊合,LED 也看得出兩聲道' }),
    H('配色'),
    S('gradientLeft', '左聲道 / 單一', G),
    S('gradientRight', '右聲道', G, false, { w: c => c.channelLayout !== 'single' }),
    S('blendMode', '疊圖混色方式', [['screen', '濾色 (screen)'], ['lighten', '變亮 (lighten)'], ['plus-lighter', '相加 (add)'], ['difference', '差異 (difference)'], ['normal', '不混色']], false,
      { w: isBlend, hint: '相加最亮;差異可以看出左右不同的頻段' }),
    B('splitGradient', '並排時共用一條漸層', { w: c => c.channelLayout === 'dual-horizontal' }),
    S('mirror', '鏡像', [['0', '關'], ['-1', '以左為準'], ['1', '以右為準']], true),
  ],
  look: [
    S('mode', '模式', [['0', '離散 FFT'], ['1', '1/24 oct'], ['2', '1/12 oct'], ['3', '1/6 oct'], ['4', '1/4 oct'], ['5', '1/3 oct'], ['6', '1/2 oct'], ['7', '全 oct'], ['8', '全 oct+'], ['10', '曲線圖']], true),
    S('colorMode', '上色方式', [['gradient', '漸層'], ['bar-index', '依長條序'], ['bar-level', '依音量']]),
    R('barSpace', '長條間距', 0, 0.9, 0.05, { w: c => !isGraph(c) }),
    H('長條樣式'),
    B('ledBars', 'LED 方塊', { w: c => !isGraph(c) }),
    B('trueLeds', '真實 LED(整格亮)', { w: c => !isGraph(c) && c.ledBars, hint: '關閉時 LED 依高度連續填滿' }),
    B('lumiBars', '亮度條', { w: c => !isGraph(c) }),
    B('alphaBars', '透明度條', { w: c => !isGraph(c) }),
    B('outlineBars', '空心條', { w: c => !isGraph(c) }),
    B('roundBars', '圓角條', { w: c => !isGraph(c) }),
    R('fillAlpha', '填色透明度', 0, 1, 0.05, { w: c => isGraph(c) || c.outlineBars }),
    R('lineWidth', '線寬', 0, 6, 0.5, { w: c => isGraph(c) || c.outlineBars }),
    H('倒影 / 背景'),
    R('reflexRatio', '倒影高度', 0, 0.5, 0.05),
    R('reflexAlpha', '倒影透明度', 0, 1, 0.05, { w: c => c.reflexRatio > 0 }),
    R('bgAlpha', '背景不透明度', 0, 1, 0.05),
    B('showBgColor', '顯示背景色'),
    H('環形(雷達)'),
    B('radial', '環形顯示'),
    B('radialInvert', '向內長', { w: c => c.radial }),
    R('radius', '內圈半徑', 0.1, 0.9, 0.05, { w: c => c.radial }),
    R('spinSpeed', '旋轉速度', -10, 10, 0.5, { w: c => c.radial }),
  ],
  peaks: [
    B('showPeaks', '峰值點', { w: c => !isGraph(c) }),
    B('peakLine', '峰值連線', { w: c => isGraph(c) }),
    B('fadePeaks', '峰值淡出', { w: c => !isGraph(c) && c.showPeaks }),
    R('peakHoldTime', '峰值停留 ms', 0, 2000, 50),
    R('peakFadeTime', '峰值淡出 ms', 0, 3000, 50, { w: c => c.fadePeaks }),
    H('刻度與標示'),
    B('showScaleX', '頻率刻度'), B('showScaleY', 'dB 刻度'),
    B('noteLabels', '音名標示'), B('showFPS', '顯示 FPS'),
  ],
  analysis: [
    S('fftSize', 'FFT 大小', [['2048', '2048(快)'], ['4096', '4096'], ['8192', '8192'], ['16384', '16384'], ['32768', '32768(細)']], true, { hint: '越大低頻越精細,但反應較慢、較耗電' }),
    R('smoothing', '平滑', 0, 0.95, 0.05),
    R('gravity', '落下速度', 0.5, 10, 0.1),
    H('範圍'),
    R('minDecibels', '最低 dB', -120, -50, 1), R('maxDecibels', '最高 dB', -50, 0, 1),
    R('minFreq', '最低頻率 Hz', 20, 500, 5), R('maxFreq', '最高頻率 Hz', 2000, 22000, 100),
    H('刻度與加權'),
    S('frequencyScale', '頻率刻度法', [['log', '對數'], ['bark', 'Bark'], ['mel', 'Mel'], ['linear', '線性']]),
    S('weightingFilter', '加權', [['', '無'], ['A', 'A'], ['B', 'B'], ['C', 'C'], ['D', 'D'], ['468', 'ITU-R 468']]),
    B('ansiBands', 'ANSI 標準頻帶'),
    B('linearAmplitude', '線性振幅'), R('linearBoost', '線性增益', 1, 5, 0.1, { w: c => c.linearAmplitude }),
  ],
  meter: [
    S('viewMode', '畫面顯示', [['spectrum', '頻譜(可加電平表)'], ['vu', '全螢幕類比 VU 錶頭']], false, { hint: '全螢幕 VU:整個畫面只顯示左右兩個 VU 錶頭,頻譜分析會暫停以省電' }),
    B('meterOn', '頻譜畫面加顯示電平表', { w: c => !isFull(c), hint: '左右聲道各一個,以峰值(條狀)或平均(VU 指針)顯示' }),
    S('meterStyle', '樣式', [['bar', '條狀(dBFS 峰值)'], ['vu', '類比 VU 指針錶頭']], false, { w: c => !isFull(c) && c.meterOn }),
    S('meterPos', '位置', [['bottom', '下方(橫排)'], ['right', '右側(直排)'], ['left', '左側(直排)']], false, { w: c => !isFull(c) && c.meterOn, hint: '橫放手機可放右側;直條時 L 在左/上、R 在右/下' }),
    H('類比 VU 錶頭', vuShown),
    R('vuSize', '錶頭高度 px', 60, 260, 2, { w: c => !isFull(c) && vuShown(c), hint: '方形錶頭的邊長;下方橫排會佔用這個高度' }),
    R('vuScale', '錶頭佔畫面比例 %', 50, 100, 1, { w: isFull, hint: '全螢幕時錶頭自動放到最大,這裡可再縮小留邊' }),
    S('vuFace', '面板色', [['cream', '暖米白(背光)'], ['amber', '琥珀'], ['white', '冷白'], ['night', '夜光藍']], false, { w: vuShown }),
    R('vuLight', '背光亮度', 0.4, 1, 0.05, { w: vuShown }),
    R('vuHead', 'Headroom 校準 dB', 4, 26, 1, { w: vuShown, hint: '0 VU = -N dBFS;對齊你的參考電平,預設 18。數字小=指針更容易頂進紅區' }),
    S('vuScaleMode', '刻度顯示', [['vu', 'VU 刻度'], ['db', 'dBFS 刻度']], false, { w: vuShown, hint: 'dBFS 刻度會依 Headroom 換算標示;內側小字永遠顯示 dBFS 對照' }),
    S('vuBezel', '外框', [['brass', '香檳黃銅'], ['gunmetal', '槍灰'], ['silver', '銀'], ['black', '黑']], false, { w: vuShown }),
    R('vuSpeed', '指針反應速度', 0.5, 2, 0.1, { w: vuShown, hint: '1.0 = 標準 VU(約 300 ms);越大越靈敏' }),
    B('vuOverlay', '疊在頻譜上(不縮小頻譜)', { w: vuShown, hint: '橫放手機畫面較矮時很實用' }),
    H('條狀樣式', barShown),
    R('meterH', '粗細 px', 8, 90, 1, { w: barShown, hint: '最細 8 px;太細時會自動隱藏刻度與 L/R 字母' }),
    S('meterColor', '顏色', [['sync', '跟隨主頻譜配色'], ['level', '依電平(綠黃紅)'], ...GRADS.map(g => [g, '自訂:' + g])], false, { w: barShown, hint: '預設與主頻譜相同;左右分開配色時 L/R 各用各的' }),
    S('meterMin', '最低刻度', [['-72', '-72 dB'], ['-60', '-60 dB'], ['-48', '-48 dB'], ['-36', '-36 dB'], ['-24', '-24 dB']], true, { w: barShown, hint: '範圍越小,常用音量區間越寬' }),
    B('meterSeg', '分段 LED 樣式', { w: barShown }),
    B('meterRms', '同時顯示平均(RMS)', { w: barShown, hint: '實心=平均能量,淡色延伸=瞬間峰值' }),
    B('meterTicks', '顯示刻度線', { w: barShown }),
    R('meterHold', '峰值停留 ms', 0, 3000, 100, { w: barShown }),
    R('meterFall', '回落速度 dB/秒', 6, 80, 2, { w: barShown, hint: '數字小=緩慢回落(像類比表)' }),
  ],
  perf: [
    S('maxFPS', '最高 FPS', [['0', '原生(跟螢幕)'], ['60', '60'], ['30', '30'], ['20', '20']], true, { hint: '30 約可省一半繪圖耗電' }),
    B('loRes', '低解析度模式', { hint: '以較低畫質換取效能與電力' }),
    B('keepAwake', '嘗試保持螢幕不熄滅', { hint: 'http 區網連線多半不支援,請另行調長螢幕逾時' }),
  ],
};

const DEFAULTS = {
  channelLayout: 'single', gradientLeft: 'classic', gradientRight: 'classic', splitGradient: false, mirror: 0, blendMode: 'screen',
  mode: 5, colorMode: 'gradient', barSpace: 0.25, ledBars: true, trueLeds: true, lumiBars: false, alphaBars: false,
  outlineBars: false, roundBars: false, fillAlpha: 1, lineWidth: 0, reflexRatio: 0, reflexAlpha: 0.15, bgAlpha: 1, showBgColor: true,
  showPeaks: true, peakLine: false, fadePeaks: false, peakHoldTime: 500, peakFadeTime: 750,
  showScaleX: true, showScaleY: false, noteLabels: false, showFPS: false,
  radial: false, radialInvert: false, radius: 0.3, spinSpeed: 0,
  fftSize: 8192, smoothing: 0.6, gravity: 3.8, minDecibels: -85, maxDecibels: -20, minFreq: 25, maxFreq: 20000,
  frequencyScale: 'log', weightingFilter: '', linearAmplitude: false, linearBoost: 1, ansiBands: false,
  maxFPS: 0, loRes: false, keepAwake: true,
  meterOn: true, meterMin: -60, meterHold: 1200, meterFall: 24, meterSeg: false, meterRms: false, meterH: 24,
  meterPos: 'bottom', meterColor: 'sync', meterTicks: true,
  viewMode: 'spectrum', vuScale: 94, meterStyle: 'bar', vuSize: 120, vuFace: 'cream', vuLight: 1, vuHead: 18, vuScaleMode: 'vu', vuBezel: 'brass', vuSpeed: 1, vuOverlay: false,

function drawVU(t) {
  const cx = meter.cx, vert = isVert(), dpr = meter.dpr || 1, A = VU_A, full = isFull(cfg), Wc = meter.w, Hc = meter.h;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, Wc, Hc);
  let S, spots;

    const land = Wc >= Hc, sc = cfg.vuScale / 100, gap = Math.round(Math.min(Wc, Hc) * 0.035);
    S = Math.floor((land ? Math.min((Wc - gap) / 2 / A, Hc) : Math.min(Wc / A, (Hc - gap) / 2)) * sc);
    if (S < 30) return;

    g.addColorStop(0, '#1c1d20'); g.addColorStop(1, '#050506'); cx.fillStyle = g; cx.fillRect(0, 0, Wc, Hc);

  } else if (!vert) {

    S = Math.min(T, Math.floor((Wc - gap - 8) / 2 / A)); if (S < 30) return;
    spots = c => ({ X: (Wc - (2 * A * S + gap)) / 2 + c * (A * S + gap), Y: (Hc - S) / 2 });
  } else {
    const Tw = Math.min(cfg.vuSize * A, Wc), gap = Math.round(cfg.vuSize * 0.06), off = cfg.meterPos === 'left' ? Wc - Tw : 0;
    S = Math.min(cfg.vuSize, Math.floor(Tw / A), Math.floor((Hc - gap - 8) / 2)); if (S < 30) return;
    spots = c => ({ X: off + (Tw - A * S) / 2, Y: (Hc - (2 * S + gap)) / 2 + c * (S + gap) });
  }

  if (VU.key !== key) { VU.face = [buildFace(S, dpr, 0), buildFace(S, dpr, 1)]; VU.key = key; }

    cx.shadowColor = 'transparent'; cx.strokeStyle = 'rgba(255,255,255,.22)'; cx.lineWidth = Math.max(0.5, w1 * 0.5);   // 針身高光
    cx.beginPath(); cx.moveTo(ox + nx * w0 * 0.3, oy + ny * w0 * 0.3); cx.lineTo(ox + sx * len * 0.97, oy + sy * len * 0.97); cx.stroke();

}

// ======================================================================
// 音訊 / 連線
// ======================================================================
function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
  gain = ac.createGain();
  am = new AudioMotionAnalyzer($('stage'), { audioCtx: ac, connectSpeakers: false, source: gain, ...baseOpts() });   // 手機不出聲,聲音仍由電腦播放
  registerGradients(am);
  meterInit();
  applyCfg();
}

function onPCM(buf) {
  if (!fmt || ac.state !== 'running') return;
  const ch = fmt.channels;
  const i16 = new Int16Array(buf, 0, buf.byteLength >> 1);
  const frames = (i16.length / ch) | 0;
  if (!frames) return;
  const ab = ac.createBuffer(ch, frames, fmt.rate);
  const pkA = [0, 0], ssA = [0, 0];
  for (let c = 0; c < ch; c++) {
    const out = ab.getChannelData(c);
    let pk = 0, ss = 0;
    for (let i = 0, j = c; i < frames; i++, j += ch) { const v = i16[j] / 32768, a = v < 0 ? -v : v; out[i] = v; if (a > pk) pk = a; ss += v * v; }
    pkA[c] = pk; ssA[c] = ss;
  }
  if (ch === 1) { pkA[1] = pkA[0]; ssA[1] = ssA[0]; }
  const now = ac.currentTime;
  if (nextT < now + 0.02) nextT = now + LATENCY;          // 欠載 / 首包:重新建立緩衝
  else if (nextT - now > MAX_AHEAD) return;                 // 積壓過多:丟包追趕
  const src = ac.createBufferSource();
  src.buffer = ab; src.connect(gain); src.start(nextT);
  if (cfg.meterOn || isFull(cfg)) meter.q.push({ t0: nextT, t1: nextT + ab.duration, pk: pkA, ss: ssA, n: frames });
  nextT += ab.duration;
}

let retry = 0, connT = 0, started = false;
function connect() {
  clearTimeout(connT); connT = 0;
  if (ws) { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; try { ws.close(); } catch {} ws = null; }   // 一律只保留一條連線
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const sock = ws = new WebSocket(`${proto}://${location.host}/ws`);
  sock.binaryType = 'arraybuffer';
  sock.onopen = () => { retry = 0; };
  sock.onmessage = e => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.error) { toast('伺服器錯誤: ' + m.error); return; }
      fmt = m; nextT = 0; $('dot').classList.add('ok'); routeBlend(); updateInfo();
    } else onPCM(e.data);
  };
  sock.onclose = () => {
    if (ws !== sock) return;
    $('dot').classList.remove('ok'); fmt = null; updateInfo();
    clearTimeout(connT);
    if (!document.hidden) connT = setTimeout(connect, Math.min(5000, 500 * 2 ** retry++));
  };
}
function dropConn() {
  clearTimeout(connT); connT = 0;
  if (ws) { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; try { ws.close(); } catch {} ws = null; }
  fmt = null; $('dot').classList.remove('ok');
}

// 回到前景:音訊引擎在 iOS 可能被系統中斷(interrupted/suspended),需重新 resume;連線與時間軸全部重建
const showTap = on => $('tap').classList.toggle('on', !!on);
async function wake() {
  if (!started || document.hidden) return;
  if (!isFull(cfg)) { am.toggleAnalyzer(true); am2 && am2.toggleAnalyzer(true); }
  nextT = 0; meter.q.length = 0; retry = 0;
  try { await Promise.race([ac.resume(), new Promise(r => setTimeout(r, 800))]); } catch {}
  showTap(ac.state !== 'running');
  connect(); keepAwake();
}
function sleep() {   // 背景/鎖屏:關掉繪圖與連線以省電
  if (!started) return;
  am.toggleAnalyzer(false); am2 && am2.toggleAnalyzer(false); dropConn();
}
document.addEventListener('visibilitychange', () => document.hidden ? sleep() : wake());
window.addEventListener('pageshow', e => { if (e.persisted) wake(); });   // iOS 返回頁面(bfcache)
window.addEventListener('pagehide', sleep);
window.addEventListener('focus', () => { if (started && !document.hidden && (!ws || ws.readyState > 1)) wake(); });
document.addEventListener('pointerdown', () => { if (started && ac.state !== 'running') ac.resume().then(() => showTap(ac.state !== 'running')).catch(() => {}); }, true);
// 看門狗:前景時若連線已斷且沒有排程重連,或音訊引擎停了,自動恢復
setInterval(() => {
  if (!started || document.hidden) return;
  if ((!ws || ws.readyState > 1) && !connT) connect();
  if (ac.state !== 'running') { ac.resume().catch(() => {}); showTap(true); } else showTap(false);
}, 3000);
async function keepAwake() {
  if (!cfg.keepAwake) return;
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}

// ======================================================================
// 設定面板 UI
// ======================================================================
let activeTab = store.get('tab') || 'presets';
function set(k, v) { cfg[k] = v; saveCfg(); applyCfg(); refreshVisibility(); refreshPresetMarks(); if (k === 'keepAwake') keepAwake(); }
function setAll(p, own) { const q = full(p); for (const k of LOCK) if (!(own && k in p)) q[k] = cfg[k]; Object.assign(cfg, q); saveCfg(); applyCfg(); renderTab(); }

function updateInfo() {
  const el = document.getElementById('srcinfo');
  if (!el) return;
  el.textContent = !fmt ? '尚未連線到電腦'
    : `來源:${fmt.rate} Hz · ${fmt.channels === 1 ? '單聲道(左右相同)' : '立體聲'}`;
}

const rows = [];   // 目前分頁中的控制列,用於顯示條件重算
function refreshVisibility() { for (const { el, it } of rows) el.hidden = it.w ? !it.w(cfg) : false; }

function control(it) {
  const row = document.createElement('div'); row.className = 'row' + (it.t === 'range' ? ' range' : '');
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.l;
  if (it.hint) { const h = document.createElement('span'); h.className = 'hint'; h.textContent = it.hint; nm.append(h); }
  row.append(nm);
  const v = cfg[it.k];
  if (it.t === 'check') {
    const el = Object.assign(document.createElement('input'), { type: 'checkbox', className: 'sw', checked: !!v });
    el.onchange = () => set(it.k, el.checked); row.append(el);
  } else if (it.t === 'range') {
    const val = document.createElement('span'); val.className = 'v'; val.textContent = v;
    const el = Object.assign(document.createElement('input'), { type: 'range', min: it.min, max: it.max, step: it.step, value: v });
    el.oninput = () => { val.textContent = el.value; set(it.k, +el.value); };
    row.append(val, el);
    row.ondblclick = () => { el.value = DEFAULTS[it.k]; el.oninput(); };   // 連點兩下回預設
  } else {
    const el = document.createElement('select');
    for (const [ov, ol] of it.opts) el.append(new Option(ol, ov));
    el.value = String(v);
    el.onchange = () => set(it.k, it.num ? +el.value : el.value); row.append(el);
  }
  rows.push({ el: row, it });
  return row;
}

let presetBtns = [];
function refreshPresetMarks() {
  for (const { el, p, own } of presetBtns) el.classList.toggle('on', same(cfg, full(p), p, own));
}

function renderPresets(body) {
  presetBtns = [];
  const mkChip = (name, p) => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = name;
    b.onclick = () => { setAll(p, true); toast(`已套用「${name}」`); };
    presetBtns.push({ el: b, p, own: true }); return b;
  };
  const sy = document.createElement('div'); sy.className = 'info'; sy.id = 'syncinfo'; showSync(sy); body.append(sy);
  // --- 內建預設(分類) ---
  let cat = store.get('pcat') || 'led'; if (!BUILTIN_CATS.some(c => c.id === cat)) cat = BUILTIN_CATS[0].id;
  const ct = document.createElement('div'); ct.className = 'cats';
  for (const c of BUILTIN_CATS) {
    const b = document.createElement('button'); b.className = 'cat' + (c.id === cat ? ' on' : ''); b.textContent = c.label;
    b.onclick = () => { store.set('pcat', c.id); renderTab(); }; ct.append(b);
  }
  body.append(ct);
  const chips = document.createElement('div'); chips.className = 'chips big';
  for (const [name, p] of Object.entries(BUILTIN_CATS.find(c => c.id === cat).items)) chips.append(mkChip(name, p));
  body.append(chips);
  // --- 我的預設 ---
  const h1 = document.createElement('h4'); h1.textContent = '儲存目前設定'; body.append(h1);
  const save = document.createElement('div'); save.className = 'save';
  const inp = Object.assign(document.createElement('input'), { type: 'text', placeholder: '輸入預設名稱', maxLength: 24 });
  const sb = document.createElement('button'); sb.className = 'primary'; sb.textContent = '儲存';
  sb.onclick = () => {
    const name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    const exists = name in userPresets;
    userPresets[name] = { ...cfg }; pushPresets(); toast(exists ? `已更新「${name}」` : `已儲存「${name}」`);
    renderTab();
  };
  inp.onkeydown = e => { if (e.key === 'Enter') sb.click(); };
  save.append(inp, sb); body.append(save);

  const h2 = document.createElement('h4'); h2.textContent = '我的預設'; body.append(h2);
  const names = Object.keys(userPresets);
  if (!names.length) { const n = document.createElement('div'); n.className = 'note'; n.textContent = '還沒有自訂預設。調好畫面後在上方取名儲存;同名會覆蓋。預設也會存到電腦端,換手機也能用。'; body.append(n); }
  for (const name of names) {
    const r = document.createElement('div'); r.className = 'urow';
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = name;
    nm.onclick = () => { setAll(userPresets[name]); toast(`已套用「${name}」`); };
    presetBtns.push({ el: nm, p: userPresets[name] });
    const ov = document.createElement('button'); ov.textContent = '覆蓋';
    ov.title = '用目前設定覆蓋這個預設';
    ov.onclick = () => { userPresets[name] = { ...cfg }; pushPresets(); toast(`已更新「${name}」`); refreshPresetMarks(); };
    const rn = document.createElement('button'); rn.textContent = '改名';
    rn.onclick = () => {
      const inp2 = Object.assign(document.createElement('input'), { type: 'text', value: name, maxLength: 24 });
      nm.replaceWith(inp2); inp2.focus(); inp2.select();
      const done = () => {
        const nn = inp2.value.trim();
        if (nn && nn !== name && !(nn in userPresets)) {
          const next = {}; for (const k of Object.keys(userPresets)) next[k === name ? nn : k] = userPresets[k];
          userPresets = next; pushPresets();
        }
        renderTab();
      };
      inp2.onblur = done; inp2.onkeydown = e => { if (e.key === 'Enter') inp2.blur(); };
    };
    const del = document.createElement('button'); del.className = 'danger'; del.textContent = '刪除';
    del.onclick = () => {
      if (del.dataset.arm) { delete userPresets[name]; pushPresets(); toast(`已刪除「${name}」`); renderTab(); return; }
      del.dataset.arm = 1; del.textContent = '確定?'; setTimeout(() => { if (del.isConnected) { delete del.dataset.arm; del.textContent = '刪除'; } }, 2500);
    };
    r.append(nm, ov, rn, del); body.append(r);
  }
  const reset = document.createElement('button'); reset.textContent = '全部重設為預設值';
  reset.onclick = () => { setAll(DEFAULTS, true); toast('已重設'); };
  body.append(reset);
  const n2 = document.createElement('div'); n2.className = 'note'; n2.textContent = '提示:滑桿連點兩下可回到預設值。'; body.append(n2);
  refreshPresetMarks();
}

function renderTab() {
  const body = $('pbody'); body.replaceChildren(); rows.length = 0;
  for (const b of $('tabs').children) b.classList.toggle('on', b.dataset.t === activeTab);
  if (activeTab === 'presets') { renderPresets(body); return; }
  for (const it of SCHEMA[activeTab]) {
    if (it.info) { const d = document.createElement('div'); d.className = 'info'; d.id = 'srcinfo'; body.append(d); updateInfo(); continue; }
    if (it.h) { const h = document.createElement('h4'); h.textContent = it.h; body.append(h); rows.push({ el: h, it }); continue; }
    body.append(control(it));
  }
  refreshVisibility();
}
function buildTabs() {
  for (const [id, label] of TABS) {
    const b = document.createElement('button'); b.className = 'tab'; b.textContent = label; b.dataset.t = id;
    b.onclick = () => { activeTab = id; store.set('tab', id); renderTab(); $('pbody').scrollTop = 0; };
    $('tabs').append(b);
  }
  if (!SCHEMA[activeTab] && activeTab !== 'presets') activeTab = 'presets';
  renderTab();
}

// ======================================================================
// 開始 / 面板開關
// ======================================================================
$('go').onclick = async () => {
  initAudio();
  await ac.resume();
  $('start').remove();
  started = true; connect(); keepAwake();
};
const togglePanel = f => { const on = $('panel').classList.toggle('show', f); if (on) pullPresets(); };
$('stage').addEventListener('click', () => togglePanel());
$('stage2').addEventListener('click', () => togglePanel());
$('meter').addEventListener('click', () => togglePanel());
$('gear').onclick = () => togglePanel();
// ⚙ 按鈕:開始後與每次點擊畫面時顯示,5 秒後自動淡出(面板開啟時不顯示)
let gearT;
function showGear() {
  clearTimeout(gearT);
  if ($('panel').classList.contains('show')) { $('gear').classList.remove('on'); return; }
  $('gear').classList.add('on');
  gearT = setTimeout(() => $('gear').classList.remove('on'), 5000);
}
document.addEventListener('pointerdown', () => setTimeout(showGear, 0), { capture: true });
$('go').addEventListener('click', showGear);
$('close').onclick = () => { togglePanel(false); showGear(); };
$('viewbtn').onclick = () => { set('viewMode', cfg.viewMode === 'vu' ? 'spectrum' : 'vu'); renderTab(); toast(cfg.viewMode === 'vu' ? '全螢幕 VU' : '頻譜畫面'); };
$('fs').onclick = () => {
  const el = document.documentElement;
  (document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el));
};
buildTabs();
pullPresets();
</script>
</body>
</html>
