<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Spectrum">
<title>Spectrum</title>
<style>
  :root { color-scheme: dark; --bg: #0e0e0f; --line: #262628; --mut: #8c8c92; --acc: #35c37a; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font: 14px/1.4 system-ui, -apple-system, "Noto Sans TC", sans-serif; color: #e4e4e6; -webkit-tap-highlight-color: transparent; }
  .stage { position: fixed; left: var(--meter-l, 0px); right: var(--meter-r, 0px); top: 0; bottom: var(--meter-b, 0px); }
  #stage, #stage2 { touch-action: none; }
  #meter { position: fixed; display: none; z-index: 1; touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  #stage2 { pointer-events: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; z-index: 9; }
  #start button { font: inherit; font-size: 18px; padding: 14px 34px; border-radius: 999px; border: 1px solid #555; background: #111; color: #fff; }
  #msg { opacity: .65; text-align: center; padding: 0 24px; }
  #dot { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(52px + var(--meter-r, 0px)); width: 8px; height: 8px; border-radius: 50%; background: #c33; z-index: 3; opacity: .8; pointer-events: none; }
  #dot.ok { background: #3c6; }
  #gear { position: fixed; top: calc(4px + env(safe-area-inset-top)); right: calc(6px + var(--meter-r, 0px)); z-index: 3; width: 40px; height: 40px; border: 0; background: none; color: #fff; font-size: 22px; opacity: 0; pointer-events: none; transition: opacity .5s; }
  #gear.on { opacity: .5; pointer-events: auto; }

  /* 面板:直放=底部抽屜,橫放=右側欄(頻譜維持可見,邊調邊看) */
  #panel { position: fixed; z-index: 4; display: none; flex-direction: column; background: rgba(14,14,15,.93); backdrop-filter: blur(8px); border: 1px solid var(--line); }
  #panel.show { display: flex; }
  @media (orientation: portrait) { #panel { left: 0; right: 0; bottom: 0; height: 58vh; border-radius: 16px 16px 0 0; border-bottom: 0; } }
  @media (orientation: landscape) { #panel { top: 0; right: 0; bottom: 0; width: min(390px, 46vw); border-right: 0; border-top: 0; border-bottom: 0; padding-right: env(safe-area-inset-right); } }
  /* 電平表放在右側時,設定面板改靠左,避免蓋住它 */
  @media (orientation: landscape) { html[data-mpos="right"] #panel { left: 0; right: auto; border-left: 0; border-right: 1px solid var(--line); padding-right: 0; } }
  /* 調整大小模式:長按電平表進入,顯示虛線外框 + 把手 + 按鈕;此時設定面板暫時收起,避免互相干擾 */
  #rz { position: fixed; z-index: 8; display: none; box-sizing: border-box; border: 2px dashed var(--acc); background: rgba(52,199,89,.07); touch-action: none; -webkit-user-select: none; user-select: none; cursor: ew-resize; }
  #rz.on { display: block; }
  #rz .grip { position: absolute; background: var(--acc); border-radius: 6px; opacity: .9; }
  #rz .grip.v { top: 50%; width: 8px; height: 64px; margin-top: -32px; } #rz .grip.h { left: 50%; height: 8px; width: 64px; margin-left: -32px; }
  #rz .tools { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-size: 13px; color: #fff; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #rz .tools button { pointer-events: auto; min-height: 40px; padding: 6px 14px; }
  #rz .tools .row2 { display: flex; gap: 8px; }
  #rz .val { font-weight: 700; font-size: 16px; }
  #phead { display: flex; gap: 8px; align-items: center; padding: 10px 12px 6px; }
  #phead b { flex: 1; font-size: 15px; }
  #tabs { display: flex; gap: 6px; padding: 6px 12px 10px; min-height: 34px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; line-height: 1.5; padding: 5px 14px; border-radius: 999px; border: 1px solid #333; background: transparent; color: #bbb; }
  .tab.on { background: #e9e9ec; color: #111; border-color: #e9e9ec; font-weight: 600; }
  #pbody { overflow-y: auto; padding: 4px 14px calc(20px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  button, select, input[type=text] { font: inherit; background: #1c1c1e; color: #eee; border: 1px solid #3a3a3d; border-radius: 8px; padding: 7px 11px; }
  button:active { background: #2a2a2d; }
  .primary { background: var(--acc); color: #04210f; border-color: var(--acc); font-weight: 600; }
  .danger { color: #ff8a80; }
  h4 { margin: 16px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--mut); text-transform: uppercase; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1b1b1d; min-height: 28px; }
  .row[hidden], #fs[hidden] { display: none !important; }
  .row .nm { flex: 1; }
  .row .hint { display: block; color: var(--mut); font-size: 12px; margin-top: 1px; }
  .row.range { flex-wrap: wrap; }
  .row.range .v { color: var(--mut); font-variant-numeric: tabular-nums; }
  .row.range input { flex: 0 0 100%; margin: 4px 0 0; accent-color: var(--acc); }
  .row.sel { flex-direction: column; align-items: stretch; gap: 7px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { flex: 1 1 auto; min-height: 40px; padding: 7px 12px; font-size: 14px; border-radius: 10px; color: #ccc; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .seg.many button { flex: 0 1 auto; min-height: 36px; padding: 6px 11px; font-size: 13px; }
  .seg button.on { background: var(--acc); border-color: var(--acc); color: #04210f; font-weight: 600; }
  .seg i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); flex: none; }
  .sw { appearance: none; -webkit-appearance: none; flex: none; width: 46px; height: 28px; border-radius: 14px; background: #3a3a3d; position: relative; transition: background .15s; margin: 0; }
  .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s; }
  .sw:checked { background: var(--acc); } .sw:checked::after { left: 21px; }
  #tap { position: fixed; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); color: #fff; font-size: 18px; }
  #tap.on { display: flex; }
  .glabel { margin: 10px 0 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--mut); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0; }
  .chip { padding: 8px 14px; border-radius: 10px; }
  .chips.big { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
  .chips.big .chip { min-height: 46px; font-size: 15px; padding: 10px 8px; }
  .cats { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 6px; }
  .cat { flex: none; min-height: 40px; padding: 8px 16px; border-radius: 999px; border: 1px solid #333; background: transparent; color: #bbb; font-size: 15px; }
  .cat.on { background: var(--acc); border-color: var(--acc); color: #000; font-weight: 600; }
  .chip.on { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
  .save { display: flex; gap: 8px; padding: 6px 0; } .save input { flex: 1; min-width: 0; }
  .urow { display: flex; align-items: center; gap: 6px; padding: 7px 0; border-bottom: 1px solid #1b1b1d; }
  .urow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 6px 0; }
  .urow .nm.on { color: var(--acc); font-weight: 600; }
  .urow button { padding: 5px 9px; font-size: 13px; }
  .note { color: var(--mut); font-size: 12px; padding: 6px 0; }
  .info { background: #161618; border-radius: 8px; padding: 8px 10px; margin: 8px 0 2px; font-size: 12px; color: #aaa; }
  #toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: #e9e9ec; color: #111; padding: 8px 16px; border-radius: 999px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="stage" class="stage"></div>
<div id="stage2" class="stage"></div>
<canvas id="meter"></canvas>
<div id="dot"></div>
<button id="gear" aria-label="設定">⚙</button>
<div id="tap">點一下畫面繼續</div>
<div id="toast"></div>
<div id="diag" style="position:fixed;left:8px;bottom:8px;z-index:30;display:none;font:11px/1.4 monospace;color:#9f9;background:rgba(0,0,0,.65);padding:4px 8px;border-radius:6px;pointer-events:none;white-space:pre"></div>
<div id="start">
  <button id="go">開始</button>
  <div id="msg">點一下開始(手機需要一次觸碰才能啟動音訊引擎)<br>開始後點畫面任一處或左上角 ⚙ 開啟設定</div>
</div>
<div id="panel">
  <div id="phead"><b>顯示設定</b><small style="opacity:.45;font-size:10px;margin-left:6px">v1018-24</small><button id="viewbtn">畫面 ⇄</button><button id="fs">全螢幕</button><button id="close" class="primary">完成</button></div>
  <div id="tabs"></div>
  <div id="pbody"></div>
</div>

<script type="module">
import AudioMotionAnalyzer from './vendor/audioMotion-analyzer.js';

const $ = id => document.getElementById(id);
const LATENCY = 0.09;     // 目標播放延遲(秒),抖動大的 Wi-Fi 可調高
const MAX_AHEAD = 0.35;   // 排程超過此值就丟包追趕
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

let ac, am, am2, gain, split, gL, gR, ws, fmt, nextT = 0, wakeLock = null;

// ======================================================================
// 設定資料
// ======================================================================
const GRADS = ['classic', 'prism', 'rainbow', 'orangered', 'steelblue', 'amber', 'vfd', 'ice', 'sunset', 'mono', 'cyan', 'magenta', 'lime'];
const CUSTOM_GRADS = {
  amber:   { bgColor: '#100800', colorStops: ['#ff3b00', '#ff9d00', '#ffd27a'] },
  vfd:     { bgColor: '#00100f', colorStops: ['#e8ffff', '#3ff', '#0aa'] },
  ice:     { bgColor: '#02060d', colorStops: ['#fff', '#8cf', '#36f'] },
  sunset:  { bgColor: '#0a0410', colorStops: ['#ffe14d', '#ff7a3d', '#c2185b', '#5b2a86'] },
  mono:    { bgColor: '#000',    colorStops: ['#fff', '#888'] },
  // 純色系,疊圖混色時左右最容易分辨
  cyan:    { bgColor: '#000',    colorStops: ['#bffcff', '#00e5ff', '#007b99'] },
  magenta: { bgColor: '#000',    colorStops: ['#ffc2f0', '#ff2bd6', '#8a0a72'] },
  lime:    { bgColor: '#000',    colorStops: ['#f4ffb0', '#b6ff00', '#4a8a00'] },
};
const G = GRADS.map(g => [g, g]);
const B = (k, l, o = {}) => ({ k, l, t: 'check', ...o });
const R = (k, l, min, max, step, o = {}) => ({ k, l, t: 'range', min, max, step, ...o });
const S = (k, l, opts, num, o = {}) => ({ k, l, t: 'select', opts, num, ...o });
const H = (l, w) => ({ h: l, w });

const isFull = c => c.viewMode === 'vu' || c.viewMode === 'scope';   // 全螢幕(類比 VU 或向量示波器)
const vuShown = c => c.viewMode === 'vu' || (!isFull(c) && c.meterOn && (c.meterStyle === 'vu' || c.meterStyle === 'scope'));   // 向量示波器的條帶沿用 VU 的大小 / 位置 / 面板色設定
const scopeShown = c => c.viewMode === 'scope' || (!isFull(c) && c.meterOn && c.meterStyle === 'scope');
const barShown = c => !isFull(c) && c.meterOn && c.meterStyle === 'bar';
const isGraph = c => +c.mode === 10;
const vuN = () => cfg.vuCount === '1' ? 1 : cfg.vuCount === '2' ? 2 : (cfg.channelLayout === 'single' && !isFull(cfg) ? 1 : 2);   // 錶頭數:自動=單頻譜 1 個,其餘 2 個
const monoM = () => vuShown(cfg) && vuN() === 1;   // 只顯示一個類比 VU(L+R 合併);條狀(數位)電平表永遠左右雙聲道
const isBlend = c => c.channelLayout === 'blend';

const TABS = [
  ['presets', '預設'], ['layout', '聲道版面'], ['look', '外觀'], ['meter', '電平表'], ['peaks', '峰值/刻度'], ['analysis', '分析'], ['perf', '省電'],
];

const SCHEMA = {
  layout: [
    { info: true },
    S('channelLayout', '聲道版面', [
      ['single', '合併(單一)'], ['blend', '左右疊圖(混色)'], ['dual-combined', '左右疊圖(原生)'],
      ['dual-horizontal', '左右並排'], ['dual-vertical', '上下分割'],
    ], false, { hint: '「疊圖(混色)」左右各自上色並用混色疊合,LED 也看得出兩聲道' }),
    H('配色'),
    S('gradientLeft', '左聲道 / 單一', G),
    S('gradientRight', '右聲道', G, false, { w: c => c.channelLayout !== 'single' }),
    S('blendMode', '疊圖混色方式', [['screen', '濾色 (screen)'], ['lighten', '變亮 (lighten)'], ['plus-lighter', '相加 (add)'], ['difference', '差異 (difference)'], ['normal', '不混色']], false,
      { w: isBlend, hint: '相加最亮;差異可以看出左右不同的頻段' }),
    B('splitGradient', '並排時共用一條漸層', { w: c => c.channelLayout === 'dual-horizontal' }),
    S('mirror', '鏡像', [['0', '關'], ['-1', '以左為準'], ['1', '以右為準']], true),
  ],
  look: [
    S('mode', '模式', [['0', '離散 FFT'], ['1', '1/24 oct'], ['2', '1/12 oct'], ['3', '1/6 oct'], ['4', '1/4 oct'], ['5', '1/3 oct'], ['6', '1/2 oct'], ['7', '全 oct'], ['8', '全 oct+'], ['10', '曲線圖']], true),
    S('colorMode', '上色方式', [['gradient', '漸層'], ['bar-index', '依長條序'], ['bar-level', '依音量']]),
    R('barSpace', '長條間距', 0, 0.9, 0.05, { w: c => !isGraph(c) }),
    H('長條樣式'),
    B('ledBars', 'LED 方塊', { w: c => !isGraph(c) }),
    B('trueLeds', '真實 LED(整格亮)', { w: c => !isGraph(c) && c.ledBars, hint: '關閉時 LED 依高度連續填滿' }),
    B('lumiBars', '亮度條', { w: c => !isGraph(c) }),
    B('alphaBars', '透明度條', { w: c => !isGraph(c) }),
    B('outlineBars', '空心條', { w: c => !isGraph(c) }),
    B('roundBars', '圓角條', { w: c => !isGraph(c) }),
    R('fillAlpha', '填色透明度', 0, 1, 0.05, { w: c => isGraph(c) || c.outlineBars }),
    R('lineWidth', '線寬', 0, 6, 0.5, { w: c => isGraph(c) || c.outlineBars }),
    H('倒影 / 背景'),
    R('reflexRatio', '倒影高度', 0, 0.5, 0.05),
    R('reflexAlpha', '倒影透明度', 0, 1, 0.05, { w: c => c.reflexRatio > 0 }),
    R('bgAlpha', '背景不透明度', 0, 1, 0.05),
    B('showBgColor', '顯示背景色'),
    H('環形(雷達)'),
    B('radial', '環形顯示'),
    B('radialInvert', '向內長', { w: c => c.radial }),
    R('radius', '內圈半徑', 0.1, 0.9, 0.05, { w: c => c.radial }),
    R('spinSpeed', '旋轉速度', -10, 10, 0.5, { w: c => c.radial }),
  ],
  peaks: [
    B('showPeaks', '峰值點', { w: c => !isGraph(c) }),
    B('peakLine', '峰值連線', { w: c => isGraph(c) }),
    B('fadePeaks', '峰值淡出', { w: c => !isGraph(c) && c.showPeaks }),
    R('peakHoldTime', '峰值停留 ms', 0, 2000, 50),
    R('peakFadeTime', '峰值淡出 ms', 0, 3000, 50, { w: c => c.fadePeaks }),
    H('刻度與標示'),
    B('showScaleX', '頻率刻度'), B('showScaleY', 'dB 刻度'),
    B('noteLabels', '音名標示'), B('showFPS', '顯示 FPS'),
  ],
  analysis: [
    S('fftSize', 'FFT 大小', [['2048', '2048(快)'], ['4096', '4096'], ['8192', '8192'], ['16384', '16384'], ['32768', '32768(細)']], true, { hint: '越大低頻越精細,但反應較慢、較耗電' }),
    R('smoothing', '平滑', 0, 0.95, 0.05),
    R('gravity', '落下速度', 0.5, 10, 0.1),
    H('範圍'),
    R('minDecibels', '最低 dB', -120, -50, 1), R('maxDecibels', '最高 dB', -50, 0, 1),
    R('minFreq', '最低頻率 Hz', 20, 500, 5), R('maxFreq', '最高頻率 Hz', 2000, 22000, 100),
    H('刻度與加權'),
    S('frequencyScale', '頻率刻度法', [['log', '對數'], ['bark', 'Bark'], ['mel', 'Mel'], ['linear', '線性']]),
    S('weightingFilter', '加權', [['', '無'], ['A', 'A'], ['B', 'B'], ['C', 'C'], ['D', 'D'], ['468', 'ITU-R 468']]),
    B('ansiBands', 'ANSI 標準頻帶'),
    B('linearAmplitude', '線性振幅'), R('linearBoost', '線性增益', 1, 5, 0.1, { w: c => c.linearAmplitude }),
  ],
  meter: [
    S('viewMode', '畫面顯示', [['spectrum', '頻譜(可加電平表 / 向量)'], ['vu', '全螢幕類比 VU 錶頭'], ['scope', '全螢幕 向量示波器']], false, { hint: '全螢幕:整個畫面只顯示 VU 或向量示波器,頻譜分析會暫停以省電。頻譜畫面下方還能再加電平表(條狀 / VU / 向量)' }),
    B('meterOn', '頻譜畫面加顯示電平表', { w: c => !isFull(c), hint: '左右聲道各一個,以峰值(條狀)或平均(VU 指針)顯示' }),
    S('meterStyle', '樣式', [['bar', '條狀(dBFS 峰值)'], ['vu', '類比 VU 指針錶頭'], ['scope', '向量示波器(相位 / 結像)']], false, { w: c => !isFull(c) && c.meterOn }),
    S('scopeGain', '示波器增益', [['auto', '自動放大'], ['fixed', '固定(0 dBFS 滿幅)']], false, { w: scopeShown, hint: '自動:音樂平均音量低時自動放大圖形;固定:可比較不同曲目的實際大小' }),
    S('scopeTrail', '示波器殘影', [['short', '短'], ['mid', '中'], ['long', '長']], false, { w: scopeShown }),
    S('meterPos', '位置', [['auto', '自動(直放下方、橫放右側)'], ['bottom', '下方(橫排)'], ['right', '右側(直排)'], ['left', '左側(直排)']], false, { w: c => !isFull(c) && c.meterOn, hint: '橫放手機可放右側;直條時 L 在左/上、R 在右/下' }),
    H('類比 VU 錶頭', vuShown),
    R('vuSize', '錶頭高度 px', 60, 420, 2, { w: c => !isFull(c) && vuShown(c), hint: '下方橫排時每個錶頭的高度(手機直立時兩個會上下疊放)。放在右/左側時依螢幕自動決定:橫放自動縮小、直放可較大,不受此設定限制' }),
    R('vuScale', '錶頭佔畫面比例 %', 50, 100, 1, { w: isFull, hint: '全螢幕時錶頭自動放到最大,這裡可再縮小留邊' }),

function setSync(ok) { syncOk = ok; const el = document.getElementById('syncinfo'); if (el) showSync(el); }
function showSync(el) {
  el.textContent = syncOk === false ? '⚠ 未同步到電腦端:請關閉舊的伺服器視窗,重新執行 start.bat(目前預設只存在這個瀏覽器)'
    : syncOk ? '✓ 已與電腦端同步(F:\\AudioMotion\\presets.json)' : '同步狀態:檢查中…';
  el.style.color = syncOk === false ? '#ffb74d' : '';
}
async function pushPresets() {
  persistLocal();
  try {
    const r = await fetch('/api/presets', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(userPresets) });
    setSync(r.ok);
    if (!r.ok) toast('預設未同步到電腦端(請重啟 start.bat)');
  } catch { setSync(false); toast('預設未同步到電腦端'); }
}
async function pullPresets() {
  try {
    const r = await fetch('/api/presets', { cache: 'no-store' });
    const ct = r.headers.get('content-type') || '';
    if (!r.ok || !ct.includes('json')) { setSync(false); return; }   // 舊版伺服器沒有這個 API
    const server = await r.json();
    const merged = { ...userPresets, ...server };
    const changed = JSON.stringify(merged) !== JSON.stringify(server);
    userPresets = merged; persistLocal(); setSync(true);
    if (changed) await pushPresets();
    if (activeTab === 'presets') renderTab();
  } catch { setSync(false); }
}

function applyTo(inst, over = {}) {
  for (let pass = 0; pass < 2; pass++)   // 兩輪:避開 min/max dB、頻率的設定先後驗證問題
    for (const [k, v] of Object.entries(cfg)) {
      if (OWN.has(k)) continue;
      try { inst[k] = k in over ? over[k] : v; } catch {}
    }
}
function applyCfg() {
  if (!am) return;
  syncLayout();
  if (isBlend(cfg)) {
    applyTo(am, { channelLayout: 'single' });
    applyTo(am2, { channelLayout: 'single', gradientLeft: cfg.gradientRight, gradientRight: cfg.gradientRight,
                   showBgColor: false, overlay: true, showScaleX: false, showScaleY: false, showFPS: false, bgAlpha: 0 });
    $('stage2').style.mixBlendMode = cfg.blendMode;
  } else {
    applyTo(am);
  }
  applyMeter();
}

function registerGradients(inst) {
  for (const [n, g] of Object.entries(CUSTOM_GRADS)) inst.registerGradient(n, JSON.parse(JSON.stringify(g)));
}
const baseOpts = () => Object.fromEntries(Object.entries(cfg).filter(([k]) => !OWN.has(k) && !k.startsWith('gradient') && k !== 'channelLayout'));

function routeBlend() {   // 把輸入拆成 L / R 兩路;單聲道來源時兩路相同
  if (!split) return;
  try { split.disconnect(); } catch {}
  split.connect(gL, 0);
  split.connect(gR, fmt && fmt.channels === 1 ? 0 : 1);
}
function syncLayout() {
  const want = isBlend(cfg);
  if (want && !am2) {
    if (!split) { split = ac.createChannelSplitter(2); gL = ac.createGain(); gR = ac.createGain(); gain.connect(split); }
    routeBlend();
    am.disconnectInput();
    am.connectInput(gL);
    am2 = new AudioMotionAnalyzer($('stage2'), { audioCtx: ac, connectSpeakers: false, source: gR, ...baseOpts(), start: !document.hidden });
    registerGradients(am2);
  } else if (!want && am2) {
    am2.destroy(); am2 = null; $('stage2').replaceChildren(); $('stage2').style.mixBlendMode = '';
    am.disconnectInput();
    am.connectInput(gain);
  }
}

function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
  gain = ac.createGain();
  am = new AudioMotionAnalyzer($('stage'), { audioCtx: ac, connectSpeakers: false, source: gain, ...baseOpts() });   // 手機不出聲,聲音仍由電腦播放
  registerGradients(am);
  meterInit();
  applyCfg();
}

const DG = { pk: 0, run: 0, full: 0, n: 0, t: 0 };
function diagTick(t) {
  const el = $('diag'); if (!cfg.vuDiag) { if (el.style.display !== 'none') el.style.display = 'none'; return; }
  if (t - DG.t < 1000) return; DG.t = t; el.style.display = 'block';
  const db = DG.pk > 0 ? (20 * Math.log10(DG.pk)).toFixed(2) : '-inf';
  el.textContent = `最大取樣 ${db} dBFS\n最長連續≥門檻 ${DG.run} 點\n滿幅(32767)點數 ${DG.full}\n取樣率 ${fmt ? fmt.rate : '-'}`;
  DG.pk = DG.run = DG.full = DG.n = 0;
}
function onPCM(buf) {
  if (!fmt || ac.state !== 'running') return;
  const ch = fmt.channels;
  const i16 = new Int16Array(buf, 0, buf.byteLength >> 1);
  const frames = (i16.length / ch) | 0;
  if (!frames) return;
  const ab = ac.createBuffer(ch, frames, fmt.rate);
  const pkA = [0, 0], ssA = [0, 0], runA = [0, 0], thr = Math.pow(10, cfg.vuOverThr / 20);
  for (let c = 0; c < ch; c++) {
    const out = ab.getChannelData(c);
    let pk = 0, ss = 0, run = 0, best = 0, full = 0;
    for (let i = 0, j = c; i < frames; i++, j += ch) { const v = i16[j] / 32768, a = v < 0 ? -v : v; out[i] = v; if (a > pk) pk = a; ss += v * v; if (a >= thr) { if (++run > best) best = run; } else run = 0; if (a >= 0.99996) full++; }
    if (pk > DG.pk) DG.pk = pk; if (best > DG.run) DG.run = best; DG.full += full; DG.n += frames;
    pkA[c] = pk; ssA[c] = ss; runA[c] = best;
  }
  if (ch === 1) { pkA[1] = pkA[0]; ssA[1] = ssA[0]; runA[1] = runA[0]; }
  const now = ac.currentTime;
  if (nextT < now + 0.02) nextT = now + LATENCY;          // 欠載 / 首包:重新建立緩衝
  else if (nextT - now > MAX_AHEAD) return;                 // 積壓過多:丟包追趕
  const src = ac.createBufferSource();
  src.buffer = ab; src.connect(gain); src.start(nextT);
  if (cfg.meterOn || isFull(cfg)) meter.q.push({ t0: nextT, t1: nextT + ab.duration, pk: pkA, ss: ssA, run: runA, n: frames });
  nextT += ab.duration;
}

let retry = 0, connT = 0, started = false;
function connect() {
  clearTimeout(connT); connT = 0;
  if (ws) { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; try { ws.close(); } catch {} ws = null; }   // 一律只保留一條連線
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const sock = ws = new WebSocket(`${proto}://${location.host}/ws`);
  sock.binaryType = 'arraybuffer';
  sock.onopen = () => { retry = 0; };
  sock.onmessage = e => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.error) { toast('伺服器錯誤: ' + m.error); return; }
      fmt = m; nextT = 0; $('dot').classList.add('ok'); routeBlend(); updateInfo();
    } else onPCM(e.data);
  };
  sock.onclose = () => {
    if (ws !== sock) return;
    $('dot').classList.remove('ok'); fmt = null; updateInfo();
    clearTimeout(connT);

}
function dropConn() {

  fmt = null; $('dot').classList.remove('ok');

// 回到前景:iOS 在背景/鎖屏後常讓音訊引擎或網頁處於「假運轉」狀態(狀態是 running,但時鐘不走、不再出聲),
// 只能靠重新載入頁面復原。所以離開超過 1.5 秒就自動重新載入並直接接回串流,只需點一下畫面即可恢復音訊。
const showTap = on => $('tap').classList.toggle('on', !!on);
let hiddenAt = 0;

  try {
    const last = +sessionStorage.getItem('rlAt') || 0;

  } catch {}

}
async function wake() {
  if (!started || document.hidden) return;

  hiddenAt = 0;
  if (!isFull(cfg)) { am.toggleAnalyzer(true); am2 && am2.toggleAnalyzer(true); }
  nextT = 0; meter.q.length = 0; retry = 0;
  try { await Promise.race([ac.resume(), new Promise(r => setTimeout(r, 800))]); } catch {}
  showTap(ac.state !== 'running');

}
function sleep() {   // 背景/鎖屏:關掉繪圖與連線以省電

}
document.addEventListener('visibilitychange', () => document.hidden ? sleep() : wake());

window.addEventListener('pagehide', sleep);
document.addEventListener('pointerdown', () => { if (started && ac.state !== 'running') ac.resume().then(() => showTap(ac.state !== 'running')).catch(() => {}); }, true);
// 看門狗:前景時連線斷了就重連;音訊時鐘停止前進(假運轉)就重新載入
let lastCT = -1, stuck = 0;
setInterval(() => {
  if (!started || document.hidden) { stuck = 0; return; }
  if ((!ws || ws.readyState > 1) && !connT) connect();
  if (ac.state !== 'running') { ac.resume().catch(() => {}); showTap(true); stuck = 0; lastCT = -1; return; }
  showTap(false);
  if (ac.currentTime === lastCT) { if (++stuck >= 2) reloadSoon('audio clock stalled'); } else stuck = 0;
  lastCT = ac.currentTime;
}, 2500);

  if (!cfg.keepAwake) return;

}

    place();
  };
  rz.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; drag = { y0: e.clientY, s0: cfg.vuScale }; try { rz.setPointerCapture(e.pointerId); } catch {} pend = { x: e.clientX, y: e.clientY }; if (!raf) raf = requestAnimationFrame(apply); });
  rz.addEventListener('pointermove', e => { if (!drag) return; pend = { x: e.clientX, y: e.clientY }; if (!raf) raf = requestAnimationFrame(apply); });
  const up = () => { drag = null; }; rz.addEventListener('pointerup', up); rz.addEventListener('pointercancel', up);
  const enter = () => {
    if (rzOn) return; rzOn = true; $('panel').classList.remove('show'); place(); rz.classList.add('on'); try { navigator.vibrate && navigator.vibrate(15); } catch {}
  };
  rzExit = () => { if (!rzOn) return; rzOn = false; rz.classList.remove('on'); suppUntil = Date.now() + 400; if ($('panel').classList.contains('show')) renderTab(); };
  rz.querySelector('#rzok').onclick = () => rzExit();
  rz.querySelector('#rzfit').onclick = () => { vuAutoFit(); place(); };
  window.addEventListener('resize', () => { if (rzOn) setTimeout(place, 50); });
  // 長按電平表 0.5 秒進入調整大小模式(期間手指移動超過 10px 視為捲動/誤觸,取消)
  let lp = null;
  el.addEventListener('pointerdown', e => { clearTimeout(lp && lp.t); lp = { x0: e.clientX, y0: e.clientY }; lp.t = setTimeout(() => { if (lp) { lp = null; suppUntil = Date.now() + 800; enter(); } }, 500); });
  el.addEventListener('pointermove', e => { if (lp && Math.hypot(e.clientX - lp.x0, e.clientY - lp.y0) > 10) { clearTimeout(lp.t); lp = null; } });
  const cancel = () => { if (lp) { clearTimeout(lp.t); lp = null; } };
  el.addEventListener('pointerup', cancel); el.addEventListener('pointercancel', cancel);
  el.addEventListener('contextmenu', e => e.preventDefault());
})();
$('meter').addEventListener('click', () => { if (Date.now() < suppUntil) return; togglePanel(); });
// ---- 左右滑動:循環切換「我的預設」(往左滑 = 下一個,往右滑 = 上一個)----
(() => {
  let st = null;
  document.addEventListener('pointerdown', e => {
    st = (rzOn || $('panel').classList.contains('show') || e.target.closest('#panel,#rz,button,#gear,#tap,#go')) ? null : { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId, reg: e.target.closest('#meter') ? 'm' : 's' };
  }, true);
  document.addEventListener('pointerup', e => {
    if (!st || e.pointerId !== st.id) return; const dx = e.clientX - st.x, dy = e.clientY - st.y, dt = performance.now() - st.t, st0 = st; st = null;
    if (dt > 700) return;
    if (cfg.vuOverMode === 'hold' && Math.abs(dx) < 12 && Math.abs(dy) < 12 && meter.cx) {   // 永久保持模式:點燈號重置
      const r0 = meter.cx.canvas.getBoundingClientRect();
      for (let c = 0; c < 2; c++) { const L = meter.lamp[c]; if (L && Math.hypot(e.clientX - r0.left - L.x, e.clientY - r0.top - L.y) <= L.r) { meter.clip[c] = -1e9; toast('OVER 已重置'); break; } }
    }
    if (Math.abs(dy) >= 70 && Math.abs(dx) < Math.abs(dy) * 0.5) {   // 上下滑:兩區分開 —— 電平表區換 VU 面板 / 電平表顏色;頻譜區換頻譜配色
      suppUntil = Date.now() + 450; const dir = dy < 0 ? 1 : -1, cyc = (arr, cur) => arr[((arr.indexOf(cur) < 0 ? 0 : arr.indexOf(cur)) + dir + arr.length) % arr.length];
      if (st0.reg === 'm' || isFull(cfg)) {
        if (vuShown(cfg)) { const f = cyc(['cream', 'amber', 'paperwhite', 'iceblue', 'night', 'blackwhite', 'blackmono', 'blackorange'], cfg.vuFace); set('vuFace', f); toast('VU 面板:' + ({ cream: '暖米白', amber: '琥珀', paperwhite: '白底 黑紅字', iceblue: '冰藍背光', night: '夜光藍', blackwhite: '黑底 白紅字', blackmono: '黑底 純白線條', blackorange: '橘紅 黑底' })[f]); }
        else if (cfg.meterOn) { const c = cyc(['sync', 'level', ...GRADS], cfg.meterColor); set('meterColor', c); toast('電平表顏色:' + (c === 'sync' ? '跟隨頻譜' : c === 'level' ? '依電平' : c)); }
      } else {
        const L = cyc(GRADS, cfg.gradientLeft), R = cyc(GRADS, cfg.gradientRight); set('gradientLeft', L); set('gradientRight', R); toast('頻譜配色:' + L);
      }
      return;
    }
    if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.5) return;
    suppUntil = Date.now() + 450;
    const names = Object.keys(userPresets); if (!names.length) { toast('還沒有自訂預設:設定 → 預設 → 儲存目前設定'); return; }
    let i = names.indexOf(store.get('cust')); i = i < 0 ? (dx < 0 ? 0 : names.length - 1) : (i + (dx < 0 ? 1 : -1) + names.length) % names.length;
    store.set('cust', names[i]); setAll(userPresets[names[i]], true); toast(`${i + 1}/${names.length}  ${names[i]}`);
  }, true);
  document.addEventListener('pointercancel', () => { st = null; }, true);
})();
$('gear').onclick = () => togglePanel();
// ⚙ 按鈕:開始後與每次點擊畫面時顯示,5 秒後自動淡出(面板開啟時不顯示)
let gearT;
function showGear() {
  clearTimeout(gearT);
  if ($('panel').classList.contains('show')) { $('gear').classList.remove('on'); return; }
  $('gear').classList.add('on');
  gearT = setTimeout(() => $('gear').classList.remove('on'), 5000);
}
document.addEventListener('pointerdown', () => setTimeout(showGear, 0), { capture: true });
$('go').addEventListener('click', showGear);
$('close').onclick = () => { togglePanel(false); showGear(); };
$('viewbtn').onclick = () => { const nx = { spectrum: 'vu', vu: 'scope', scope: 'spectrum' }[cfg.viewMode] || 'vu'; set('viewMode', nx); renderTab(); toast({ vu: '全螢幕 VU', scope: '全螢幕 向量示波器', spectrum: '頻譜畫面' }[nx]); };
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) $('fs').hidden = true;   // iPhone Safari 不支援網頁全螢幕 API,隱藏無效按鈕(請改用「加入主畫面」)
$('fs').onclick = () => {
  const el = document.documentElement;
  (document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el));
};
window.addEventListener('resize', () => { if (meter.cx && !isFull(cfg) && cfg.meterOn && (vuShown(cfg) || cfg.meterPos === 'auto')) applyMeter(); });   // 轉向時重算下方 VU 高度
buildTabs();
try { if (sessionStorage.getItem('resume') === '1') { sessionStorage.removeItem('resume'); startApp(true); } } catch {}
pullPresets();
</script>
</body>
